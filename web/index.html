<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeiad English Coach</title>
  <style>
    :root { font-family: Inter, Segoe UI, Arial, sans-serif; color-scheme: dark; }
    body { margin: 0; background: #0f1117; color: #f5f7fb; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 18px 80px; }
    h1 { margin-bottom: 6px; }
    .muted { color: #aab2c0; }
    .panel { background: #171b24; border: 1px solid #2a3140; border-radius: 18px; padding: 18px; margin-top: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    select, input, button {
      border-radius: 12px; border: 1px solid #364055; background: #10141d; color: #fff;
      padding: 11px 13px; font: inherit;
    }
    input { flex: 1; min-width: 260px; }
    button { cursor: pointer; background: #2563eb; border-color: #2563eb; }
    button.secondary { background: #242b39; border-color: #364055; }
    #messages { min-height: 260px; }
    .msg { padding: 12px 14px; border-radius: 14px; margin: 10px 0; white-space: pre-wrap; }
    .user { background: #1d4ed8; margin-left: 12%; }
    .assistant { background: #242b39; margin-right: 12%; }
    .arabic { direction: rtl; text-align: right; color: #dbeafe; margin-top: 8px; }
    .status { font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
<main>
  <h1>Zeiad English Coach</h1>
  <div class="muted">American English tutor for Arabic speakers — Phase 1</div>

  <section class="panel">
    <div class="row">
      <select id="scenario">
        <option value="free_conversation">Free conversation</option>
        <option value="job_interview">Job interview</option>
        <option value="work">Work</option>
        <option value="shopping">Shopping</option>
        <option value="school">School</option>
        <option value="phone_call">Phone call</option>
        <option value="introductions">Introductions</option>
      </select>
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
      <button id="newSession" class="secondary">New session</button>
    </div>
    <div id="status" class="status" style="margin-top:10px">Checking local server…</div>
  </section>

  <section class="panel">
    <div id="messages"></div>
    <div class="row">
      <input id="text" autocomplete="off" placeholder="Type an English sentence for now…">
      <button id="send">Send</button>
    </div>
    <p class="muted">Microphone streaming, TTS, and pronunciation scoring are next.</p>
  </section>
</main>

<script>
let sessionId = null;
const statusEl = document.getElementById("status");
const messages = document.getElementById("messages");
const input = document.getElementById("text");

function addMessage(kind, text, arabic) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  if (arabic) {
    const ar = document.createElement("div");
    ar.className = "arabic";
    ar.textContent = arabic;
    div.appendChild(ar);
  }
  messages.appendChild(div);
}

async function createSession() {
  const scenario = document.getElementById("scenario").value;
  const level = document.getElementById("level").value;
  const response = await fetch("/api/sessions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({scenario, level})
  });
  const data = await response.json();
  sessionId = data.session_id;
  statusEl.textContent = "Session #" + sessionId + " ready";
  messages.innerHTML = "";
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  if (!sessionId) await createSession();
  addMessage("user", text);
  input.value = "";
  const scenario = document.getElementById("scenario").value;
  const level = document.getElementById("level").value;
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId, text, scenario, level})
  });
  const data = await response.json();
  addMessage("assistant", data.text || "No response", data.explanation_ar);
}

document.getElementById("newSession").addEventListener("click", createSession);
document.getElementById("send").addEventListener("click", send);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") send();
});

(async () => {
  try {
    const health = await fetch("/health").then(r => r.json());
    statusEl.textContent = health.app + " is running locally";
    await createSession();
  } catch (error) {
    statusEl.textContent = "Local server is not reachable";
  }
})();
</script>
</body>
</html>
