name: One-time repository URL repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-rebrand-urls.yml"

permissions:
  contents: write

jobs:
  fix-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair repository URLs after rebrand
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD = "wiss84/ZeiadYazajiGPT"
          NEW = "mmaatrix/ZeiadYazajiGPT"
          WORKFLOW = Path(".github/workflows/fix-rebrand-urls.yml")

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path == Path("LICENSE") or path == WORKFLOW:
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(OLD, NEW)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
          PY

          if grep -RIn --exclude=LICENSE --exclude-dir=.git "wiss84/ZeiadYazajiGPT" .; then
            echo "ERROR: stale repository URLs remain"
            exit 1
          fi

      - name: Commit URL repair
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Zeiad Yazaji"
          git config user.email "mmaatrix@users.noreply.github.com"
          git add -A
          git commit -m "Repair repository URLs after ZeiadYazajiGPT rename"
          git push origin main
