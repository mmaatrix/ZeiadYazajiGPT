name: One-time ZeiadYazajiGPT rebrand

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebrand-zeiad.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace project name everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          ROOT = Path(".")
          OLD = re.compile(r"thirtytutors", re.IGNORECASE)
          NEW = "ZeiadYazajiGPT"
          WORKFLOW = Path(".github/workflows/rebrand-zeiad.yml")

          # Replace textual occurrences. Keep LICENSE unchanged because its
          # Required Notice must remain verbatim under the PolyForm license.
          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts or path == Path("LICENSE") or path == WORKFLOW:
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = OLD.sub(NEW, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")

          # Rename matching files/directories bottom-up, including binary assets.
          for current, dirs, files in os.walk(".", topdown=False):
              cur = Path(current)
              if ".git" in cur.parts:
                  continue

              for name in files:
                  src = cur / name
                  if src == WORKFLOW:
                      continue
                  new_name = OLD.sub(NEW, name)
                  if new_name != name:
                      src.rename(cur / new_name)

              for name in dirs:
                  src = cur / name
                  if ".git" in src.parts:
                      continue
                  new_name = OLD.sub(NEW, name)
                  if new_name != name:
                      src.rename(cur / new_name)

          # One-shot workflow: remove itself after performing the rebrand.
          if WORKFLOW.exists():
              WORKFLOW.unlink()
          PY

          echo "Remaining occurrences outside LICENSE:"
          if grep -RIni --exclude=LICENSE --exclude-dir=.git "thirtytutors" .; then
            echo "ERROR: remaining occurrences found"
            exit 1
          fi

          echo "Remaining path names:"
          if find . -path './.git' -prune -o -iname '*thirtytutors*' -print | grep -q .; then
            find . -path './.git' -prune -o -iname '*thirtytutors*' -print
            echo "ERROR: remaining matching path names found"
            exit 1
          fi

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Zeiad Yazaji"
          git config user.email "mmaatrix@users.noreply.github.com"
          git add -A
          git commit -m "Rename ThirtyTutors references to ZeiadYazajiGPT"
          git push origin main
